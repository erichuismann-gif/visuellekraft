<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ylvis Klo-Plan</title>
  <meta name="theme-color" content="#faf6f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1815" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ylvi Klo">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icon.svg" alt="" width="40" height="40">
      <div>
        <h1>Ylvis Klo-Plan</h1>
        <p id="status" class="status">Noch keine Einträge</p>
      </div>
    </div>
    <button id="menuBtn" class="icon-btn" aria-label="Menü" aria-haspopup="true">⋯</button>
    <div id="menu" class="menu" hidden>
      <button data-action="export">Backup exportieren</button>
      <button data-action="import">Backup importieren</button>
    </div>
    <input id="importFile" type="file" accept="application/json,.json" hidden>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-view="list" aria-selected="true">Verlauf</button>
    <button role="tab" data-view="week" aria-selected="false">Wochenplan</button>
  </nav>

  <main>
    <section id="view-list" class="view">
      <div class="today" id="todaySummary"></div>
      <div id="list"></div>
    </section>

    <section id="view-week" class="view" hidden>
      <div class="week-nav">
        <button class="icon-btn" id="prevWeek" aria-label="Vorherige Woche">‹</button>
        <strong id="weekLabel"></strong>
        <button class="icon-btn" id="nextWeek" aria-label="Nächste Woche">›</button>
      </div>
      <div class="legend">
        <span><i class="dot pipi"></i>Pipi</span>
        <span><i class="dot kacka"></i>Kacka</span>
        <span><i class="dot beides"></i>Beides</span>
      </div>
      <div id="week"></div>
    </section>
  </main>

  <button id="addBtn" class="fab" aria-label="Neuer Eintrag">＋ Eintrag</button>

  <!-- Eintrag anlegen / bearbeiten -->
  <dialog id="entryDialog">
    <form id="entryForm" method="dialog">
      <h2 id="formTitle">Neuer Eintrag</h2>

      <fieldset class="types">
        <legend>Was war's?</legend>
        <label><input type="radio" name="type" value="pipi" checked><span>💧 Pipi</span></label>
        <label><input type="radio" name="type" value="kacka"><span>💩 Kacka</span></label>
        <label><input type="radio" name="type" value="beides"><span>💧💩 Beides</span></label>
      </fieldset>

      <label class="field">
        <span>Wann?</span>
        <input type="datetime-local" name="time" required>
      </label>

      <div class="field">
        <span>Beweisfoto</span>
        <div id="photoBox" class="photo-box">
          <img id="photoPreview" alt="Vorschau Beweisfoto" hidden>
          <div class="photo-actions">
            <label class="btn">
              📷 Foto aufnehmen
              <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
            </label>
            <label class="btn ghost">
              🖼️ Aus Galerie
              <input id="galleryInput" type="file" accept="image/*" hidden>
            </label>
            <button type="button" id="removePhoto" class="btn ghost danger" hidden>Foto entfernen</button>
          </div>
        </div>
      </div>

      <label class="field">
        <span>Notiz <small>(optional)</small></span>
        <textarea name="note" rows="2" placeholder="z. B. Konsistenz, Menge, Auffälligkeiten…"></textarea>
      </label>

      <div class="form-actions">
        <button type="button" id="deleteBtn" class="btn ghost danger" hidden>Löschen</button>
        <span class="spacer"></span>
        <button type="button" id="cancelBtn" class="btn ghost">Abbrechen</button>
        <button type="submit" class="btn primary">Speichern</button>
      </div>
    </form>
  </dialog>

  <!-- Foto groß anzeigen -->
  <dialog id="photoDialog" class="photo-dialog">
    <img id="photoLarge" alt="Beweisfoto">
    <p id="photoCaption"></p>
    <form method="dialog"><button class="btn">Schließen</button></form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
